<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpark | Recommendations</title>
    <link rel="stylesheet" href="../styles/styles.css">

   <style id="studyspark-premium-recommendations">
/* ===== Page Background ===== */
body {
    background:
        radial-gradient(ellipse at 12% 0%, rgba(108,92,231,.12), transparent 38%),
        radial-gradient(ellipse at 90% 15%, rgba(53,197,239,.06), transparent 32%),
        #0b1020 !important;
    color: #f4f5ff !important;
    line-height: 1.7;
}

/* ===== Headings & Text ===== */
h1, h2, h3, h4 {
    color: #f4f5ff !important;
    letter-spacing: -.35px;
    line-height: 1.4;
}

h1 { margin-bottom: 14px !important; }
h2 { margin-bottom: 20px !important; }
h3 { margin-bottom: 12px !important; }

p {
    color: #b9c3da;
    line-height: 1.75;
    margin-bottom: 12px;
}

a { color: #a995ff; }

/* ===== Section Spacing ===== */
section {
    margin-bottom: 34px !important;
}

section > h2,
section > h3 {
    margin-bottom: 20px !important;
}

/* ===== Cards ===== */
.card,
.history-item,
.recommendation-card,
.summary-card,
.stat-card {
    background: linear-gradient(145deg, #192440, #11192d) !important;
    border: 1px solid rgba(164,174,220,.13) !important;
    border-radius: 20px !important;
    padding: 26px !important;
    margin-bottom: 20px !important;
    color: #f4f5ff !important;
    box-shadow: 0 8px 28px rgba(0,0,0,.16) !important;
    transition: border-color .2s ease, transform .2s ease;
}

.card:hover,
.history-item:hover,
.recommendation-card:hover {
    border-color: rgba(139,112,255,.4) !important;
    transform: translateY(-2px);
}

/* ===== Recommendation Content ===== */
.recommendation-card h3,
.recommendation-card h4 {
    margin-bottom: 14px !important;
}

.recommendation-card p {
    margin-top: 8px !important;
    margin-bottom: 14px !important;
}

.recommendation-card button {
    margin: 8px 8px 4px 0 !important;
}

/* ===== History Items ===== */
.history-item {
    padding: 20px 24px !important;
    margin-bottom: 14px !important;
}

.history-item > * {
    margin-bottom: 8px;
}

.history-date {
    color: #8994b2 !important;
    font-size: 13px;
}

/* ===== Buttons ===== */
button, .btn {
    border-radius: 11px !important;
    padding: 10px 18px !important;
    transition: all .2s ease;
    cursor: pointer;
}

button:hover, .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 18px rgba(139,112,255,.2);
}

/* ===== Form Elements ===== */
input, select, textarea {
    background: #0d1528 !important;
    color: #f4f5ff !important;
    border: 1px solid rgba(164,174,220,.2) !important;
    border-radius: 10px !important;
    padding: 11px 14px !important;
    margin-top: 6px;
    margin-bottom: 12px;
}

input:focus, select:focus, textarea:focus {
    border-color: #8b70ff !important;
    box-shadow: 0 0 0 3px rgba(139,112,255,.13) !important;
    outline: none;
}

/* ===== Status Badges ===== */
.history-status,
.status-DONE {
    background: rgba(69,214,160,.13) !important;
    color: #45d6a0 !important;
    padding: 5px 11px !important;
    border-radius: 20px !important;
}

.status-PARTLY {
    background: rgba(255,190,90,.13) !important;
    color: #ffc66d !important;
    padding: 5px 11px !important;
    border-radius: 20px !important;
}

.status-SKIPPED {
    background: rgba(255,113,133,.13) !important;
    color: #ff7185 !important;
    padding: 5px 11px !important;
    border-radius: 20px !important;
}

/* ===== Priority Labels ===== */
.priority-high, .priority-HIGH { color: #ff8293 !important; }
.priority-medium, .priority-MEDIUM { color: #ffc66d !important; }
.priority-low, .priority-LOW { color: #45d6a0 !important; }

/* ===== Separators ===== */
hr {
    border-color: rgba(164,174,220,.13) !important;
    margin: 24px 0 !important;
}

/* ===== Responsive ===== */
@media (max-width: 700px) {
    .card,
    .history-item,
    .recommendation-card,
    .summary-card,
    .stat-card {
        padding: 18px !important;
        margin-bottom: 16px !important;
    }

    section {
        margin-bottom: 26px !important;
    }
}
</style>
</head>

<body>

<div class="recommendations-container">

    <h1>Personalised Recommendations</h1>
    <p>Study suggestions based on your learning activity.</p>

    <!-- Adherence Summary -->
    <div class="progress-card">
        <h2>Your Recommendation Progress</h2>

        <h3 id="adherence-value">0% Adherence</h3>

        <div class="progress-bar">
            <div class="progress-fill" id="adherence-bar"></div>
        </div>

        <div class="summary-stats">
            <p>Completed: <strong id="completed-count">0</strong></p>
            <p>Partly Done: <strong id="partly-count">0</strong></p>
            <p>Skipped: <strong id="skipped-count">0</strong></p>
            <p>Total: <strong id="total-count">0</strong></p>
        </div>
    </div>

        

    <!-- Recommendation History -->
    <div class="progress-card">
        <h2>Recommendation History</h2>
        <p>Your previously submitted feedback.</p>

        <div id="feedback-history">
            Loading history...
        </div>
    </div>

    <div id="recommendations-list" class="loading">
        Loading recommendations...
    </div>
</div>

<script src="../scripts/auth.js"></script>

<script>
    requireAuth();

    const container = document.getElementById('recommendations-list');

    let recommendations = [];

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[char]);
    }

    async function loadSummary() {
        try {
            const summary = await apiFetch(
                '/api/recommendation-feedback/summary'
            );

            document.getElementById('adherence-value').textContent =
                summary.adherenceRate + '% Adherence';

            document.getElementById('adherence-bar').style.width =
                Math.min(100, summary.adherenceRate) + '%';

            document.getElementById('completed-count').textContent =
                summary.completed;

            document.getElementById('partly-count').textContent =
                summary.partlyCompleted;

            document.getElementById('skipped-count').textContent =
                summary.skipped;

            document.getElementById('total-count').textContent =
                summary.total;

        } catch (error) {
            console.error('Summary loading error:', error);
        }
    }

    async function loadRecommendations() {

        try {
            recommendations = await apiFetch('/api/recommendations/me');

            if (!recommendations || recommendations.length === 0) {
                container.innerHTML =
                    '<p>No recommendations available.</p>';
                return;
            }

            container.innerHTML = recommendations.map((item, index) => `
                <div class="recommendation-card" data-index="${index}">

                    <span class="priority ${escapeHTML(item.priority)}">
                        ${escapeHTML(item.priority)} PRIORITY
                    </span>

                    <h2>${escapeHTML(item.title)}</h2>

                    <h3>${escapeHTML(item.subjectName)}</h3>

                    <p>${escapeHTML(item.description)}</p>

                    <div class="reason">
                        <strong>Why this?</strong>
                        <p>${escapeHTML(item.reason)}</p>
                    </div>

                    <p>
                        <strong>Suggested study time:</strong>
                        ${escapeHTML(item.suggestedHours)} hours
                    </p>

                    <div class="feedback-section">

                        <h3>How did this recommendation go?</h3>

                        <div class="feedback-buttons">
                            <button class="feedback-btn"
                                data-status="DONE">
                                Done
                            </button>

                            <button class="feedback-btn"
                                data-status="PARTLY">
                                Partly Done
                            </button>

                            <button class="feedback-btn"
                                data-status="SKIPPED">
                                Skip
                            </button>
                        </div>

                        <label>
                            How useful was this recommendation?
                        </label>

                        <br>

                        <select class="rating-select">
                            <option value="">Select rating</option>
                            <option value="1">1 - Not useful</option>
                            <option value="2">2 - Slightly useful</option>
                            <option value="3">3 - Moderately useful</option>
                            <option value="4">4 - Very useful</option>
                            <option value="5">5 - Extremely useful</option>
                        </select>

                        <button class="save-feedback">
                            Submit Feedback
                        </button>

                        <p class="feedback-message"></p>

                    </div>

                </div>
            `).join('');

            attachFeedbackEvents();

        } catch (error) {
            container.innerHTML =
                '<p>Unable to load recommendations. Please login again.</p>';

            console.error(error);
        }
    }

    function attachFeedbackEvents() {

        document.querySelectorAll('.recommendation-card').forEach(card => {

            let selectedStatus = '';

            const buttons = card.querySelectorAll('.feedback-btn');
            const ratingSelect = card.querySelector('.rating-select');
            const saveButton = card.querySelector('.save-feedback');
            const message = card.querySelector('.feedback-message');

            buttons.forEach(button => {

                button.addEventListener('click', () => {

                    selectedStatus = button.dataset.status;

                    buttons.forEach(btn => {
                        btn.style.background =
                            btn === button ? '#e8e3ff' : 'white';

                        btn.style.borderColor =
                            btn === button ? '#6c5ce7' : '#ccc';
                    });
                });
            });

            saveButton.addEventListener('click', async () => {

                if (!selectedStatus) {
                    message.textContent =
                        'Please select Done, Partly Done or Skip.';

                    message.className = 'feedback-message error';
                    return;
                }

                const rating = ratingSelect.value;

                if (!rating) {
                    message.textContent =
                        'Please select a usefulness rating.';

                    message.className = 'feedback-message error';
                    return;
                }

                const index = Number(card.dataset.index);
                const item = recommendations[index];

                saveButton.disabled = true;
                message.textContent = 'Saving feedback...';
                message.className = 'feedback-message';

                try {

                    await apiFetch('/api/recommendation-feedback', {
                        method: 'POST',

                        body: JSON.stringify({
                            subjectId: item.subjectId,
                            recommendationTitle: item.title,
                            status: selectedStatus,
                            usefulnessRating: Number(rating)
                        })
                    });

                    message.textContent =
                        'Feedback saved successfully!';

                    message.className =
                        'feedback-message success';

                    buttons.forEach(btn => btn.disabled = true);
                    ratingSelect.disabled = true;

                    saveButton.textContent = 'Feedback Submitted';

                    await loadSummary();

                } catch (error) {

                    console.error('Feedback error:', error);

                    message.textContent =
                        'Unable to save feedback. Please try again.';

                    message.className =
                        'feedback-message error';

                    saveButton.disabled = false;
                }
            });
        });
    }
    async function loadFeedbackHistory() {

    const historyContainer =
        document.getElementById('feedback-history');

    try {

        const history = await apiFetch(
            '/api/recommendation-feedback/me'
        );

        if (!history || history.length === 0) {
            historyContainer.innerHTML =
                '<p>No feedback history available yet.</p>';
            return;
        }

        historyContainer.innerHTML = history.map(item => {

            const date = item.createdAt
                ? new Date(item.createdAt).toLocaleString()
                : 'Date unavailable';

            return `
                <div class="history-item">

                    <h3>${escapeHTML(item.recommendationTitle)}</h3>

                    <span class="history-status status-${escapeHTML(item.status)}">
                        ${escapeHTML(item.status)}
                    </span>

                    <p>
                        Usefulness Rating:
                        <strong>${item.usefulnessRating ?? 'Not rated'}/5</strong>
                    </p>

                    <p class="history-date">
                        ${escapeHTML(date)}
                    </p>

                </div>
            `;

        }).join('');

    } catch (error) {

        console.error('History error:', error);

        historyContainer.innerHTML =
            '<p>Unable to load feedback history.</p>';
    }
}

    async function initializePage() {
        await loadRecommendations();
        await loadSummary();
        await loadFeedbackHistory();
    }

    initializePage();

</script>

</body>
</html>
